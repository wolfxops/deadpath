name: Deadpath Scan
description: Find dead and unused code. Deterministic; never deletes files.
author: Vivek Singh
branding:
  icon: search
  color: purple
inputs:
  path:
    description: Path to scan
    required: false
    default: "."
  mock:
    description: Run mock/fixture scan (no API keys)
    required: false
    default: "false"
  format:
    description: Output format (json, md, sarif, or table)
    required: false
    default: json
  lang:
    description: Language filter (auto, or a language id such as py, ts, go, rs, java)
    required: false
    default: auto
  only_new:
    description: Fail only on new block findings (CI ratchet against .deadpath/memory.json)
    required: false
    default: "false"
  output:
    description: Optional path to write scan output (e.g. deadpath.sarif for code scanning)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Deadpath
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Scan
      shell: bash
      run: |
        extra=()
        if [ "${{ inputs.mock }}" = "true" ]; then extra+=(--mock); fi
        if [ "${{ inputs.only_new }}" = "true" ]; then extra+=(--only-new); fi
        if [ -n "${{ inputs.output }}" ]; then
          deadpath scan "${{ inputs.path }}" --format "${{ inputs.format }}" --lang "${{ inputs.lang }}" "${extra[@]}" > "${{ inputs.output }}"
        else
          deadpath scan "${{ inputs.path }}" --format "${{ inputs.format }}" --lang "${{ inputs.lang }}" "${extra[@]}"
        fi
